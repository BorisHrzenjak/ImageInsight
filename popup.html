<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Insight</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <!-- Added Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 dark:bg-gray-800 transition-colors duration-200">
    <div class="container mx-auto p-6 bg-white dark:bg-gray-700 rounded-xl shadow-xl transition-all duration-300">
        <h1 class="text-3xl font-extrabold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 text-center">Image Insight</h1>
        <div class="mb-4 grid grid-cols-2 gap-2">
            <label for="imageUpload" class="btn bg-gradient-to-r from-blue-500 to-indigo-500 text-white py-2 px-4 rounded-lg cursor-pointer hover:from-blue-600 hover:to-indigo-600 transform hover:scale-105 flex items-center justify-center whitespace-nowrap">
                <i class="fas fa-upload mr-2"></i> Upload Img
                <input type="file" id="imageUpload" accept="image/*" class="hidden">
            </label>
            <button id="pasteImage" class="btn bg-gradient-to-r from-green-400 to-green-600 text-white py-2 px-4 rounded-lg hover:from-green-500 hover:to-green-700 transform hover:scale-105 flex items-center justify-center whitespace-nowrap">
                <i class="fas fa-paste mr-2"></i> Paste Img
            </button>
        </div>
        <div id="imagePreviewContainer" class="w-full h-64 mb-4 rounded flex items-center justify-center bg-gray-200 dark:bg-gray-600">
            <img id="imagePreview" class="hidden">
            <p id="dropText" class="text-gray-500 dark:text-gray-300">Drop image here or click to upload</p>
        </div>
        <div class="mb-4 grid grid-cols-2 gap-2">
            <button id="extractButton" class="btn bg-gradient-to-r from-purple-500 to-indigo-500 text-white py-2 px-4 rounded-lg shadow-md hover:from-purple-600 hover:to-indigo-600 transform hover:scale-105 flex items-center justify-center">
                <i class="fas fa-magic mr-2"></i> Extract
            </button>
            <button id="describeButton" class="btn bg-gradient-to-r from-indigo-500 to-purple-500 text-white py-2 px-4 rounded-lg shadow-md hover:from-indigo-600 hover:to-purple-600 transform hover:scale-105 flex items-center justify-center">
                <i class="fas fa-info-circle mr-2"></i> Describe
            </button>
        </div>
        <div class="loading">
            <div class="loading-spinner"></div>
        </div>
        <textarea id="outputText" readonly class="w-full p-3 border-2 border-purple-500 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-purple-400 dark:bg-gray-600 dark:text-white" placeholder="Results appear here..."></textarea>
        <div class="grid grid-cols-2 gap-2 mb-4">
            <button id="downloadButton" class="btn bg-gradient-to-r from-yellow-400 to-yellow-600 text-white py-2 px-4 rounded-lg shadow-md hover:from-yellow-500 hover:to-yellow-700 transform hover:scale-105 flex items-center justify-center">
                <i class="fas fa-download mr-2"></i> Download
            </button>
            <button id="copyButton" class="btn bg-gradient-to-r from-pink-400 to-pink-600 text-white py-2 px-4 rounded-lg shadow-md hover:from-pink-500 hover:to-pink-700 transform hover:scale-105 flex items-center justify-center">
                <i class="fas fa-copy mr-2"></i> Copy
            </button>
        </div>
        <button id="settingsButton" class="btn w-full bg-gray-500 hover:bg-gray-600 text-white py-2 px-4 rounded-lg shadow-md transform hover:scale-105">
            <i class="fas fa-cog mr-2"></i> Settings
        </button>
    </div>
    <div id="settingsPanel" class="settings-panel dark:bg-gray-700">
        <h2 class="text-xl font-bold mb-4 dark:text-white">API Settings</h2>
        <div class="space-y-4">
            <div>
                <label for="ocrSpaceApiKey" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">OCRSpace API Key:</label>
                <div class="flex">
                    <input type="password" id="ocrSpaceApiKey" class="flex-grow mr-2 p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-600 dark:text-white dark:border-gray-500">
                    <button id="saveOcrSpaceApiKey" class="btn bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">Save</button>
                </div>
            </div>
            <div>
                <label for="mistralApiKey" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Mistral API Key:</label>
                <div class="flex">
                    <input type="password" id="mistralApiKey" class="flex-grow mr-2 p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-600 dark:text-white dark:border-gray-500">
                    <button id="saveMistralApiKey" class="btn bg-green-500 text-white py-2 px-4 rounded hover:bg-green-600">Save</button>
                </div>
            </div>
            <div>
                <label for="darkModeToggle" class="flex items-center cursor-pointer">
                    <div class="relative">
                        <input type="checkbox" id="darkModeToggle" class="sr-only">
                        <div class="block bg-gray-600 w-14 h-8 rounded-full"></div>
                        <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition"></div>
                    </div>
                    <div class="ml-3 text-gray-700 dark:text-gray-300 font-medium">
                        Dark Mode
                    </div>
                </label>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
    <script src="options.js"></script>
</body>
</html>
